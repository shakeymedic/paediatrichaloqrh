<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 920" font-family="Inter, Arial, sans-serif">
  <!-- Paediatric surgical tracheotomy (under 8 years), drawn for EM Evidence. Steps follow page 26 of the booklet. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b705"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <clipPath id="c1"><rect x="0" y="0" width="372" height="372" rx="14"/></clipPath>
    <!-- Front of a child's neck: chin at top, sternal notch and clavicles at bottom -->
    <g id="neck">
      <rect x="0" y="0" width="372" height="372" fill="#eef3f8"/>
      <path d="M40,0 C60,40 70,60 60,90 L60,250 C60,290 20,320 -10,340 L-10,372 L382,372 L382,340 C352,320 312,290 312,250 L312,90 C302,60 312,40 332,0 Z" fill="#f4c7a8" stroke="#b9805f" stroke-width="3"/>
      <path d="M60,40 C120,95 252,95 312,40" fill="none" stroke="#b9805f" stroke-width="3"/>
      <text x="186" y="34" text-anchor="middle" font-size="19" fill="#6d4c41">chin</text>
      <path d="M150,318 C165,332 207,332 222,318" fill="none" stroke="#9c6b4e" stroke-width="3"/>
      <path d="M150,318 C110,330 60,334 20,346 M222,318 C262,330 312,334 352,346" fill="none" stroke="#9c6b4e" stroke-width="3"/>
    </g>
  </defs>

  <rect width="1152" height="920" fill="#ffffff"/>

  <!-- Panel 1: position and mark -->
  <g transform="translate(14,14)">
    <g clip-path="url(#c1)">
      <rect width="372" height="372" fill="#eef3f8"/>
      <!-- trolley -->
      <rect x="0" y="318" width="372" height="20" fill="#90a4ae"/>
      <!-- shoulder roll under the shoulders -->
      <circle cx="214" cy="292" r="26" fill="#5c8fd6" stroke="#2f5d9e" stroke-width="3"/>
      <!-- torso lying on the roll -->
      <path d="M196,226 L372,230 L372,300 L246,300 C236,272 214,262 196,270 Z" fill="#f4c7a8" stroke="#b9805f" stroke-width="3"/>
      <!-- neck, extended: runs down from the shoulders to the head -->
      <path d="M200,228 C176,238 158,250 140,262 L150,300 C168,290 184,280 200,270 Z" fill="#f4c7a8" stroke="#b9805f" stroke-width="3"/>
      <!-- head tipped back, occiput on the trolley, face to the ceiling -->
      <circle cx="104" cy="276" r="42" fill="#f4c7a8" stroke="#b9805f" stroke-width="3"/>
      <path d="M86,236 L82,222 L96,236" fill="#f4c7a8" stroke="#b9805f" stroke-width="3" stroke-linejoin="round"/>
      <path d="M130,244 C140,240 146,244 148,252" fill="none" stroke="#b9805f" stroke-width="3"/>
      <text x="90" y="212" text-anchor="middle" font-size="16" fill="#6d4c41">nose</text>
      <!-- extension arrow -->
      <path d="M48,200 C46,160 90,140 128,158" fill="none" stroke="#f2b705" stroke-width="6" marker-end="url(#ah)"/>
      <text x="22" y="128" font-size="22" font-weight="800" fill="#263238">Neck extended</text>
      <text x="282" y="352" text-anchor="middle" font-size="19" font-weight="700" fill="#2f5d9e">Shoulder roll</text>
      <path d="M236,340 L222,316" stroke="#2f5d9e" stroke-width="3"/>
      <!-- midline inset -->
      <g transform="translate(250,20) scale(0.3)">
        <use href="#neck"/>
        <line x1="186" y1="10" x2="186" y2="322" stroke="#1565c0" stroke-width="14" stroke-dasharray="26 18"/>
      </g>
      <text x="306" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">Mark</text>
      <text x="306" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">midline</text>
    </g>
    <rect width="372" height="372" rx="14" fill="none" stroke="#455a64" stroke-width="3"/>
    <circle cx="30" cy="30" r="20" fill="#1565c0"/><text x="30" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">1</text>
    <text x="186" y="404" text-anchor="middle" font-size="25" font-weight="800" fill="#263238">Position and mark</text>
    <text x="186" y="434" text-anchor="middle" font-size="19" fill="#37474f">Nose → chin → sternal notch</text>
  </g>

  <!-- Panel 2: grasp trachea, vertical skin incision -->
  <g transform="translate(390,14)">
    <g clip-path="url(#c1)">
      <use href="#neck"/>
      <!-- trachea under the skin (faint) -->
      <rect x="160" y="110" width="52" height="210" rx="20" fill="#e9a98a" opacity="0.55"/>
      <!-- thumb and middle finger pinching either side -->
      <ellipse cx="128" cy="200" rx="30" ry="44" fill="#e6b08e" stroke="#9c6b4e" stroke-width="3"/>
      <ellipse cx="244" cy="200" rx="30" ry="44" fill="#e6b08e" stroke="#9c6b4e" stroke-width="3"/>
      <ellipse cx="186" cy="150" rx="22" ry="30" fill="#e6b08e" stroke="#9c6b4e" stroke-width="3"/>
      <text x="96" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#4e342e">thumb</text>
      <text x="282" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#4e342e">middle</text>
      <text x="186" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#4e342e">index</text>
      <!-- incision from sternal notch upwards -->
      <line x1="186" y1="306" x2="186" y2="214" stroke="#c62828" stroke-width="7" stroke-linecap="round"/>
      <path d="M212,300 L212,230" stroke="#c62828" stroke-width="4" marker-end="url(#ahr)"/>
      <!-- scalpel -->
      <path d="M186,214 L214,170 L222,176 L194,218 Z" fill="#b0bec5" stroke="#455a64" stroke-width="2"/>
      <rect x="212" y="120" width="12" height="58" rx="4" transform="rotate(33 218 176)" fill="#26a69a" stroke="#00695c" stroke-width="2"/>
    </g>
    <rect width="372" height="372" rx="14" fill="none" stroke="#455a64" stroke-width="3"/>
    <circle cx="30" cy="30" r="20" fill="#1565c0"/><text x="30" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">2</text>
    <text x="186" y="404" text-anchor="middle" font-size="25" font-weight="800" fill="#263238">Grasp trachea, cut skin</text>
    <text x="186" y="434" text-anchor="middle" font-size="19" fill="#37474f">Vertical, sternal notch upwards</text>
  </g>

  <!-- Panel 3: blunt spread, retract, expose rings -->
  <g transform="translate(766,14)">
    <g clip-path="url(#c1)">
      <use href="#neck"/>
      <!-- open wound -->
      <path d="M186,100 C236,150 236,270 186,320 C136,270 136,150 186,100 Z" fill="#b84a3e" stroke="#7f2a22" stroke-width="3"/>
      <!-- trachea with rings -->
      <rect x="166" y="150" width="40" height="150" rx="14" fill="#f3e3d3" stroke="#8d6e63" stroke-width="2"/>
      <g stroke="#a1887f" stroke-width="5">
        <line x1="168" y1="180" x2="204" y2="180"/><line x1="168" y1="204" x2="204" y2="204"/>
        <line x1="168" y1="228" x2="204" y2="228"/><line x1="168" y1="252" x2="204" y2="252"/>
        <line x1="168" y1="276" x2="204" y2="276"/>
      </g>
      <!-- thyroid isthmus pushed up -->
      <path d="M160,140 C175,128 197,128 212,140 L212,156 C197,146 175,146 160,156 Z" fill="#c2185b" opacity="0.85"/>
      <path d="M186,132 L186,104" stroke="#f2b705" stroke-width="5" marker-end="url(#ah)"/>
      <text x="252" y="112" font-size="16" font-weight="700" fill="#4e342e">isthmus up</text>
      <!-- retractors pulling laterally -->
      <path d="M150,210 L40,210" stroke="#78909c" stroke-width="10" stroke-linecap="round"/>
      <path d="M150,196 L150,226" stroke="#78909c" stroke-width="8" stroke-linecap="round"/>
      <path d="M222,210 L332,210" stroke="#78909c" stroke-width="10" stroke-linecap="round"/>
      <path d="M222,196 L222,226" stroke="#78909c" stroke-width="8" stroke-linecap="round"/>
      <path d="M90,250 L30,250" stroke="#f2b705" stroke-width="6" marker-end="url(#ah)"/>
      <path d="M282,250 L342,250" stroke="#f2b705" stroke-width="6" marker-end="url(#ah)"/>
      <text x="186" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Tracheal rings exposed</text>
    </g>
    <rect width="372" height="372" rx="14" fill="none" stroke="#455a64" stroke-width="3"/>
    <circle cx="30" cy="30" r="20" fill="#1565c0"/><text x="30" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">3</text>
    <text x="186" y="404" text-anchor="middle" font-size="25" font-weight="800" fill="#263238">Spread and retract</text>
    <text x="186" y="434" text-anchor="middle" font-size="19" fill="#37474f">Kelly clamps; assistant pulls sideways</text>
  </g>

  <!-- Panel 4: vertical cut through rings 2 and 3 only -->
  <g transform="translate(202,474)">
    <g clip-path="url(#c1)">
      <rect width="372" height="372" fill="#eef3f8"/>
      <!-- trachea close-up -->
      <rect x="116" y="40" width="140" height="300" rx="40" fill="#f3e3d3" stroke="#8d6e63" stroke-width="3"/>
      <g stroke="#a1887f" stroke-width="12" stroke-linecap="round">
        <line x1="126" y1="84" x2="246" y2="84"/><line x1="126" y1="134" x2="246" y2="134"/>
        <line x1="126" y1="184" x2="246" y2="184"/><line x1="126" y1="234" x2="246" y2="234"/>
        <line x1="126" y1="284" x2="246" y2="284"/>
      </g>
      <g font-size="20" font-weight="800" fill="#455a64" text-anchor="end">
        <text x="104" y="91">1</text><text x="104" y="141">2</text><text x="104" y="191">3</text><text x="104" y="241">4</text><text x="104" y="291">5</text>
      </g>
      <!-- the cut -->
      <line x1="186" y1="120" x2="186" y2="200" stroke="#c62828" stroke-width="9" stroke-linecap="round"/>
      <text x="270" y="152" font-size="20" font-weight="800" fill="#c62828">Rings</text>
      <text x="270" y="176" font-size="20" font-weight="800" fill="#c62828">2–3</text>
      <!-- never horizontal -->
      <g transform="translate(300,272)">
        <circle r="34" fill="#fff" stroke="#c62828" stroke-width="5"/>
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
        <line x1="-24" y1="-24" x2="24" y2="24" stroke="#c62828" stroke-width="6"/>
      </g>
      <text x="300" y="336" text-anchor="middle" font-size="16" font-weight="800" fill="#c62828">NEVER</text>
      <text x="300" y="354" text-anchor="middle" font-size="16" font-weight="800" fill="#c62828">horizontal</text>
    </g>
    <rect width="372" height="372" rx="14" fill="none" stroke="#455a64" stroke-width="3"/>
    <circle cx="30" cy="30" r="20" fill="#1565c0"/><text x="30" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">4</text>
    <text x="186" y="404" text-anchor="middle" font-size="25" font-weight="800" fill="#263238">Cut rings 2–3 vertically</text>
    <text x="186" y="434" text-anchor="middle" font-size="19" fill="#c62828" font-weight="700">Never a horizontal cut</text>
  </g>

  <!-- Panel 5: tube in, confirm -->
  <g transform="translate(578,474)">
    <g clip-path="url(#c1)">
      <use href="#neck"/>
      <path d="M186,100 C236,150 236,270 186,320 C136,270 136,150 186,100 Z" fill="#b84a3e" stroke="#7f2a22" stroke-width="3"/>
      <rect x="166" y="150" width="40" height="150" rx="14" fill="#f3e3d3" stroke="#8d6e63" stroke-width="2"/>
      <g stroke="#a1887f" stroke-width="5">
        <line x1="168" y1="180" x2="204" y2="180"/><line x1="168" y1="252" x2="204" y2="252"/><line x1="168" y1="276" x2="204" y2="276"/>
      </g>
      <!-- tube entering the slit, angled towards the feet -->
      <path d="M330,96 C270,120 220,170 192,214" fill="none" stroke="#e0f2f1" stroke-width="20" stroke-linecap="round"/>
      <path d="M330,96 C270,120 220,170 192,214" fill="none" stroke="#4db6ac" stroke-width="20" stroke-opacity="0.45" stroke-linecap="round"/>
      <path d="M192,214 L186,250" stroke="#4db6ac" stroke-width="16" stroke-linecap="round"/>
      <rect x="314" y="74" width="40" height="34" rx="6" fill="#26a69a" transform="rotate(-20 334 91)"/>
      <!-- capnography -->
      <rect x="18" y="62" width="126" height="76" rx="10" fill="#263238"/>
      <path d="M28,124 L44,124 L50,86 L76,82 L82,124 L96,124 L102,86 L128,82 L134,124" fill="none" stroke="#ffeb3b" stroke-width="4"/>
      <text x="81" y="160" text-anchor="middle" font-size="18" font-weight="800" fill="#263238">EtCO2</text>
    </g>
    <rect width="372" height="372" rx="14" fill="none" stroke="#455a64" stroke-width="3"/>
    <circle cx="30" cy="30" r="20" fill="#1565c0"/><text x="30" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">5</text>
    <text x="186" y="404" text-anchor="middle" font-size="25" font-weight="800" fill="#263238">Tube in, confirm</text>
    <text x="186" y="434" text-anchor="middle" font-size="19" fill="#37474f">Shiley 3.5 neo or ETT over bougie</text>
  </g>
</svg>
